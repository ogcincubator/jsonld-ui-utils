<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>JSON-LD UI enhancer</title>
    <style>

    </style>
  </head>
  <body>
    <h1>JSON-LD UI enhancer Demo</h1>

    <h2>Observation feature</h2>
    <div id="feature"></div>

    <h2>Parcel feature (CURIE values)</h2>
    <div id="parcel-feature"></div>

    <script type="module">
      import jsonUIUtils from "./src/index.ts";

      jsonUIUtils.loadFeature('https://ogcincubator.github.io/bblocks-examples/build/tests/bbr/examples/observation/vectorObservationFeature/example_1_1.jsonld')
              .then(({feature, context}) => {
                const rootElem = document.getElementById('feature');
                jsonUIUtils.createPropertiesTable(feature, rootElem);
                jsonUIUtils.augment(rootElem, context, {
                  fallbackSparqlEndpoint: 'https://defs-hosted.opengis.net/prez-hosted-b/sparql',
                });
              });

      const parcelFeature = {
        type: 'Feature',
        id: '8446454',
        properties: {
          appellation: { label: 'Lot 1 DP 572532' },
          area: 484,
          parcelType: 'eg-parcel-type:l',
          parcelPurpose: 'eg-parcel-purpose:fst',
          parcelState: 'eg-parcel-state:created',
        },
      };

      const parcelContext = [
        {
          'eg-parcel-purpose': 'https://w3id.org/ogc/ladm/vocabs/eg/parcel-purpose/',
          'eg-parcel-type': 'https://w3id.org/ogc/ladm/vocabs/eg/parcel-type/',
          'eg-parcel-state': 'https://w3id.org/ogc/ladm/vocabs/eg/parcel-state/',
        },
        'https://ogcincubator.github.io/bblocks-land-parcels/build/annotated/ladm/land-parcels/parcel/context.jsonld',
      ];

      jsonUIUtils.loadContext(parcelContext).then(context => {
        const rootElem = document.getElementById('parcel-feature');
        jsonUIUtils.createPropertiesTable(parcelFeature, rootElem);
        jsonUIUtils.augment(rootElem, context, {
          fallbackSparqlEndpoint: 'https://defs-hosted.opengis.net/prez-hosted-b/sparql',
        });
      });
    </script>
  </body>
</html>
