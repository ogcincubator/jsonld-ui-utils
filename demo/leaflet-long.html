<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON-LD UI Utils — Leaflet Popup with Wide/Nested Content</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="../src/jsonld-ui-utils.css"/>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../dist-local/jsonld-ui-utils-leaflet.min.js"></script>
  <script>
    // Popups with deeply nested objects and very long property names/values: the popup content
    // should scroll in both directions and be resizable via the bottom-right handle.
    const data = {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        id: 'wide-and-deep',
        geometry: {type: 'Point', coordinates: [2.17, 41.38]},
        properties: {
          name: 'Feature with wide and deeply nested properties',
          aVeryLongPropertyNameThatKeepsGoingAndGoingAndWouldNormallyOverflowThePopupWindow: 'short value',
          shortKey: 'AVeryLongUnbrokenValueThatHasNoSpacesAtAllAndKeepsGoingForQuiteAWhileToTestWordBreaking0123456789',
          level1: {
            level2: {
              level3: {
                level4: {
                  level5: {
                    level6: {
                      someDeeplyNestedPropertyWithAnotherQuiteLongName: 'deep value',
                      anotherDeepOne: ['a', 'b', {c: {d: {e: 'nested in array'}}}],
                    },
                  },
                },
              },
            },
          },
          lotsOfRows: Object.fromEntries(Array.from({length: 25}, (_, i) => [`row${i + 1}`, `value ${i + 1}`])),
        },
      }],
    };

    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    jsonldUIUtilsLeaflet.createJsonLDGeoJSONLayer(L, data).then(layer => {
      layer.addTo(map);
      map.fitBounds(layer.getBounds(), {maxZoom: 12});
    });
  </script>
</body>
</html>
